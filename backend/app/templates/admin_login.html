<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员登录</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f6f8; }
    .card { width: 360px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 12px; }
    .title { font-size: 20px; margin-bottom: 16px; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #e5e7eb; }
    button { width: 100%; padding: 10px; background: #1c1d1f; color: #fff; border: none; border-radius: 8px; }
    .error { color: #d92d20; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">管理员登录</div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <input type="text" name="username" placeholder="账号" required />
      <input type="password" name="password" placeholder="密码" required />
      <button type="submit">登录</button>
    </form>
  </div>
</body>
</html>
