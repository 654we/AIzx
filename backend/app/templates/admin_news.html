<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资讯管理</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f6f8; }
    .container { width: 720px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 12px; }
    .nav { margin-bottom: 16px; }
    .nav a { margin-right: 12px; color: #1c1d1f; text-decoration: none; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e5e7eb; }
    button { margin-top: 16px; padding: 10px 16px; background: #1c1d1f; color: #fff; border: none; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/admin/settings">系统设置</a>
      <a href="/admin/scheduler">定时任务</a>
      <a href="/admin/tasks">任务触发</a>
      <a href="/admin/mcp">MCP 配置</a>
      <a href="/admin/weather">天气配置</a>
      <a href="/admin/users">用户管理</a>
      <a href="/admin/news">资讯管理</a>
      <a href="/admin/logout">退出</a>
    </div>
    <h2>新增资讯</h2>
    {% if message %}
      <p>{{ message }}</p>
    {% endif %}
    <form method="post">
      <label>标题</label>
      <input type="text" name="title" required />
      <label>原文链接</label>
      <input type="text" name="url" required />
      <label>来源</label>
      <input type="text" name="source" required />
      <label>发布时间（ISO8601）</label>
      <input type="text" name="published_at" placeholder="2024-01-01T09:00:00+08:00" required />
      <label>标签（逗号分隔）</label>
      <input type="text" name="tags" />
      <label>正文/摘要原文（可选，用于自动摘要）</label>
      <textarea name="content" rows="4"></textarea>
      <label>摘要（可选，留空则自动生成）</label>
      <textarea name="summary" rows="3"></textarea>
      <button type="submit">保存资讯</button>
    </form>
  </div>
</body>
</html>
