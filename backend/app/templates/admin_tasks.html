<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务触发</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f6f8; }
    .container { width: 900px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 12px; }
    .nav { margin-bottom: 16px; }
    .nav a { margin-right: 12px; color: #1c1d1f; text-decoration: none; }
    .card { border: 1px solid #e5e7eb; padding: 16px; border-radius: 10px; margin-bottom: 16px; }
    label { display: block; margin-top: 8px; font-size: 14px; }
    input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e5e7eb; }
    button { margin-top: 12px; padding: 8px 12px; border: none; border-radius: 6px; background: #1c1d1f; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 14px; }
    .result { margin-top: 8px; color: #1f2937; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/admin/settings">系统设置</a>
      <a href="/admin/scheduler">定时任务</a>
      <a href="/admin/tasks">任务触发</a>
      <a href="/admin/mcp">MCP 配置</a>
      <a href="/admin/weather">天气配置</a>
      <a href="/admin/users">用户管理</a>
      <a href="/admin/news">资讯管理</a>
      <a href="/admin/logout">退出</a>
    </div>
    <h2>任务触发</h2>
    <div class="card">
      <h3>立即抓取资讯</h3>
      <label>抓取条数上限</label>
      <input type="number" id="newsLimit" value="20" />
      <button onclick="triggerTask('/admin/api/tasks/news_crawl', {limit: Number(newsLimit.value)})">立即执行</button>
      <div id="newsResult" class="result"></div>
    </div>
    <div class="card">
      <h3>立即刷新天气</h3>
      <label>地区</label>
      <input type="text" id="weatherLocation" placeholder="例如：上海" />
      <button onclick="triggerTask('/admin/api/tasks/weather_refresh', {location: weatherLocation.value})">立即执行</button>
      <div id="weatherResult" class="result"></div>
    </div>
    <div class="card">
      <h3>立即运行日程分析</h3>
      <label>用户 ID（可选，空则失败提示）</label>
      <input type="number" id="scheduleUserId" />
      <button onclick="triggerTask('/admin/api/tasks/schedule_analyze', {user_id: Number(scheduleUserId.value || 0)})">立即执行</button>
      <div id="scheduleResult" class="result"></div>
    </div>

    <h3>最近执行记录</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>任务</th>
          <th>状态</th>
          <th>耗时(ms)</th>
          <th>错误</th>
          <th>时间</th>
        </tr>
      </thead>
      <tbody>
        {% for run in runs %}
        <tr>
          <td>{{ run.id }}</td>
          <td>{{ run.task_type }}</td>
          <td>{{ run.status }}</td>
          <td>{{ run.duration_ms }}</td>
          <td>{{ run.error_message }}</td>
          <td>{{ run.created_at }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script>
    async function triggerTask(url, payload) {
      const resultId = url.includes('news_crawl') ? 'newsResult'
        : url.includes('weather_refresh') ? 'weatherResult' : 'scheduleResult';
      const target = document.getElementById(resultId);
      target.textContent = '执行中...';
      const response = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload || {})
      });
      const data = await response.json();
      target.textContent = JSON.stringify(data);
    }
  </script>
</body>
</html>
